short_bio: >-
  <p>
    Hi, guys👋! I'm Siqi Fu (符思琦)😊, currently a third-year master's student at Yantai University, majoring in Computer Technology under the supervision of 
    Prof. <a href="https://drpengsong.github.io/" target="_blank">Peng Song</a>. 
    Previously, I earned my bachelor's degree at Tianjin Foreign Studies University.
  </p>
  <p>
    My current research focuses on speech emotion recognition (SER)🗣️ and multimodal emotion recognition (MER). I'm also interested in 
    multi-view learning and EEG emotion recognition.
  </p>
  <p>
    During my leisure time, I am interested in movies🎞️, music🎧️, photography📷️, and various sports🏃‍♀️~
  </p>

